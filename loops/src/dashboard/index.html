<!doctype html>
<!--
  The offline loops dashboard — an optional local view, not part of the tutorial.

  One file, no build step, no framework, no npm install for the front end. That
  constraint is doing real work: this page has to survive being ignored for six
  months and still open. Anything with a bundler would need its own upgrade path,
  and a demo tool that needs maintenance is worse than no demo tool.

  What it deliberately cannot do: edit an eval case, read a transcript, or start
  either loop. Those absences are decisions — see the archived plan.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Loops Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --vonage-purple: #871fff;
        --vonage-plum: #3d0049;
      }
      body { background: #faf9fb; }
      .card-exit { opacity: 0; transform: translateX(12px); transition: opacity .35s ease, transform .35s ease; }
      .card-enter { transition: opacity .35s ease, transform .35s ease; }
    </style>
  </head>

  <body class="text-slate-800">
    <header style="background: var(--vonage-plum)" class="text-white">
      <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Agent Loops Dashboard</h1>
          <p class="text-sm text-purple-200 mt-0.5">
            Offline review queue, eval history, and recent calls — read from
            <code class="text-purple-100">data/calls.db</code>
          </p>
        </div>
        <div class="flex items-center gap-3">
          <span id="updated" class="text-xs text-purple-200"></span>
          <button
            id="refresh"
            style="background: var(--vonage-purple)"
            class="text-white text-sm font-medium px-4 py-2 rounded-md hover:opacity-90 transition"
          >
            Refresh
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-5 gap-6">
      <!-- The wider column is the human's: what's waiting for a decision, and
           what has been decided. Adding a proposal moves it from one to the other. -->
      <div class="lg:col-span-3 space-y-8">
        <section>
          <div class="flex items-baseline gap-3 mb-3">
            <h2 class="text-lg font-semibold" style="color: var(--vonage-plum)">Proposals</h2>
            <span id="proposal-count" class="text-sm text-slate-500"></span>
          </div>
          <div id="proposals" class="space-y-3"></div>
        </section>

        <section>
          <div class="flex items-baseline gap-3 mb-3">
            <h2 class="text-lg font-semibold" style="color: var(--vonage-plum)">Decisions</h2>
            <span id="decision-count" class="text-sm text-slate-500"></span>
          </div>
          <div id="decisions" class="space-y-5"></div>
        </section>
      </div>

      <aside class="lg:col-span-2 space-y-6">
        <section>
          <h2 class="text-lg font-semibold mb-3" style="color: var(--vonage-plum)">
            Last Eval Runs
          </h2>
          <div id="eval-runs" class="space-y-2"></div>
        </section>

        <section>
          <h2 class="text-lg font-semibold mb-3" style="color: var(--vonage-plum)">
            Recent Calls
          </h2>
          <div id="calls" class="bg-white rounded-lg border border-slate-200 overflow-hidden"></div>
        </section>
      </aside>
    </main>

    <script>
      const REFRESH_MS = 30_000;

      // Everything the page renders is server data, so every interpolation goes
      // through here. `notes` and `input` are caller utterances that reached us
      // through a transcript — untrusted text by definition.
      const esc = (v) =>
        String(v ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]),
        );

      const el = (id) => document.getElementById(id);

      // An empty state that names the command which fills it. Built by
      // concatenation rather than a multi-line template, so no stray whitespace
      // lands between the command and the full stop.
      const empty = (before, cmd, after = ".") =>
        `<div class="bg-white border border-dashed border-slate-300 rounded-lg p-6 text-center">` +
        `<p class="text-sm text-slate-500">${esc(before)}` +
        (cmd ? ` <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">${esc(cmd)}</code>${esc(after)}` : "") +
        `</p></div>`;

      const time = (iso) => {
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? String(iso ?? "") : d.toLocaleString();
      };

      // --- Proposals --------------------------------------------------------

      const OUTCOME_STYLE = {
        completed: "bg-green-100 text-green-800",
        fallback: "bg-yellow-100 text-yellow-800",
        handoff: "bg-red-100 text-red-800",
        error: "bg-slate-200 text-slate-700",
      };

      function proposalCard(p) {
        const expected =
          esc(p.expected_outcome) +
          (p.expected_handoff_reason ? ` (${esc(p.expected_handoff_reason)})` : "");
        const evidence = p.source_call_ids?.length
          ? `${p.source_call_ids.length} call${p.source_call_ids.length === 1 ? "" : "s"}`
          : "";

        return `
          <article class="card-enter bg-white rounded-lg border border-slate-200 p-4 shadow-sm" data-id="${esc(p.id)}">
            <!-- The notes field leads. It is the question a human has to answer;
                 everything else on the card is supporting evidence for it. -->
            <p class="text-[15px] leading-relaxed text-slate-900">${esc(p.notes) || "<span class='text-slate-400'>(no notes)</span>"}</p>

            <dl class="mt-3 space-y-1 text-sm">
              <div class="flex gap-2">
                <dt class="text-slate-500 w-20 shrink-0">Input</dt>
                <dd class="font-mono text-slate-700">"${esc(p.input)}"</dd>
              </div>
              <div class="flex gap-2">
                <dt class="text-slate-500 w-20 shrink-0">Expects</dt>
                <dd>
                  <span class="px-2 py-0.5 rounded text-xs font-medium ${OUTCOME_STYLE[p.expected_outcome] ?? "bg-slate-100 text-slate-700"}">${expected}</span>
                </dd>
              </div>
            </dl>

            <div class="mt-4 flex items-center gap-2">
              <button data-action="add" data-id="${esc(p.id)}"
                style="background: var(--vonage-purple)"
                class="text-white text-sm font-medium px-3 py-1.5 rounded-md hover:opacity-90 transition">
                Add to Suite
              </button>
              <button data-action="dismiss" data-id="${esc(p.id)}"
                class="text-slate-600 text-sm font-medium px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50 transition">
                Dismiss
              </button>
              <span class="ml-auto text-xs text-slate-400">${esc(evidence)}</span>
            </div>
          </article>`;
      }

      async function loadProposals() {
        const proposals = await fetch("/api/proposals").then((r) => r.json());
        el("proposal-count").textContent = proposals.length
          ? `${proposals.length} waiting`
          : "";
        el("proposals").innerHTML = proposals.length
          ? proposals.map(proposalCard).join("")
          : empty("No proposals waiting. Run", "npm run review", " to scan for patterns.");
      }

      // One listener on the container rather than per-card handlers, so a
      // re-render never leaves stale listeners behind.
      el("proposals").addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const { action, id } = button.dataset;
        const card = button.closest("article");
        button.disabled = true;

        const response = await fetch(`/api/proposals/${encodeURIComponent(id)}/${action}`, {
          method: "POST",
        });

        if (!response.ok) {
          button.disabled = false;
          button.textContent = "Failed — retry";
          return;
        }

        // Fade the card, then reconcile against the server rather than trusting
        // the local guess: another tab, or a `sqlite3` UPDATE in a terminal, may
        // have changed the queue since this render.
        card.classList.add("card-exit");
        setTimeout(() => {
          loadProposals();
          loadDecisions();
        }, 350);
      });

      // --- Decisions --------------------------------------------------------
      //
      // Read-only, and written for whoever decides what the agent should do
      // next, not for whoever maintains the tests. Each row says in plain
      // English what the agent does today; the caller's own words sit underneath
      // as the example. The two groups are the two answers a human has given:
      // "that's right, keep it" (added) and "callers want more than this"
      // (dismissed).

      const DECISION_GROUPS = [
        {
          status: "added",
          title: "Working as intended",
          note: "the agent handles this correctly; a test keeps it that way",
          tone: "text-green-700",
        },
        {
          status: "dismissed",
          title: "Needs a decision",
          note: "callers keep asking for this; the agent can't do it yet",
          tone: "text-amber-700",
        },
      ];

      // What callers were asking about, by handoff reason.
      const TOPICS = {
        billing: "Billing questions",
        returns: "Returns",
        cancellation: "Cancellations",
        account: "Account questions",
        unsupported: "Asking for a person",
      };

      // The rule, in plain English, built only from structured columns — no
      // parsing of the notes text. Each outcome comes from exactly one kind of
      // proposal the review loop writes, which is what makes this mapping safe:
      // handoff from repeated handoffs, fallback from timeouts, and completed
      // only from fallbacks that weren't timeouts — callers who asked about a
      // second order and hit the one-lookup limit.
      function plainRule(d) {
        if (d.expected_outcome === "handoff") {
          const topic = TOPICS[d.expected_handoff_reason] ?? "Out-of-scope requests";
          return [topic, "transferred to support"];
        }
        if (d.expected_outcome === "fallback") {
          return ["Slow order lookups", "apologizes instead of guessing"];
        }
        if (d.expected_outcome === "completed") {
          return ["Asking about a second order", "one order per call"];
        }
        return [d.input, d.expected_outcome];
      }

      function decisionRow(d) {
        const [topic, behavior] = plainRule(d);
        const n = d.source_call_ids?.length ?? 0;

        return `
          <li class="px-4 py-3 border-t border-slate-100 first:border-t-0">
            <div class="flex items-start justify-between gap-3">
              <p class="text-sm text-slate-900">
                <span class="font-medium">${esc(topic)}</span>
                <span class="text-slate-400 mx-1">→</span>
                ${esc(behavior)}
              </p>
              <span class="text-xs text-slate-400 shrink-0">${n ? `${n} call${n === 1 ? "" : "s"}` : ""}</span>
            </div>
            <p class="mt-1 text-xs text-slate-500 truncate" title="${esc(d.notes)}">e.g. "${esc(d.input)}"</p>
          </li>`;
      }

      async function loadDecisions() {
        const decisions = await fetch("/api/decisions").then((r) => r.json());

        // Only groups that have something in them. An empty heading on a
        // projector is a question nobody asked.
        const groups = DECISION_GROUPS.map((g) => ({
          ...g,
          items: decisions.filter((d) => d.status === g.status),
        })).filter((g) => g.items.length);

        el("decision-count").textContent = groups
          .map((g) => `${g.items.length} ${g.title.toLowerCase()}`)
          .join(" · ");

        el("decisions").innerHTML = groups.length
          ? groups
              .map(
                (g) => `
            <div>
              <h3 class="text-xs font-semibold uppercase tracking-wide mb-2 ${g.tone}">
                ${esc(g.title)} <span class="font-normal normal-case tracking-normal text-slate-400">— ${esc(g.note)}</span>
              </h3>
              <ul class="bg-white rounded-lg border border-slate-200">${g.items.map(decisionRow).join("")}</ul>
            </div>`,
              )
              .join("")
          : empty("No decisions yet. Add a proposal to the suite and it lands here.");
      }

      // --- Eval runs --------------------------------------------------------

      function evalRunRow(run, index) {
        const green = run.failed === 0;
        const badge = green
          ? `<span class="text-green-700 font-semibold">✓ ${run.passed}/${run.totalCases}</span>`
          : `<span class="text-red-700 font-semibold">✗ ${run.passed}/${run.totalCases}</span>`;

        const cases = (run.results ?? [])
          .map(
            (r) => `
              <li class="flex items-start gap-2 py-1 border-t border-slate-100">
                <span class="${r.passed ? "text-green-600" : "text-red-600"} font-semibold">${r.passed ? "✓" : "✗"}</span>
                <span class="font-mono text-xs text-slate-600 break-all">${esc(r.caseId)}</span>
              </li>`,
          )
          .join("");

        return `
          <details class="bg-white rounded-lg border border-slate-200 overflow-hidden" ${index === 0 ? "open" : ""}>
            <summary class="px-4 py-2.5 cursor-pointer hover:bg-slate-50 flex items-center justify-between gap-3">
              <span class="text-sm">
                <span class="font-medium text-slate-700">${esc(run.agentVersion)}</span>
                <span class="text-slate-400 text-xs block">${esc(time(run.runAt))}</span>
              </span>
              ${badge}
            </summary>
            <ul class="px-4 pb-3 text-sm">${cases}</ul>
          </details>`;
      }

      async function loadEvalRuns() {
        const runs = await fetch("/api/eval-runs").then((r) => r.json());
        el("eval-runs").innerHTML = runs.length
          ? runs.slice(0, 5).map(evalRunRow).join("")
          : empty("No eval runs yet. Run", "npm run eval");
      }

      // --- Recent calls -----------------------------------------------------

      async function loadCalls() {
        const calls = await fetch("/api/calls").then((r) => r.json());

        if (!calls.length) {
          el("calls").innerHTML = empty("No calls yet. Make a phone call or run", "npm run seed-calls");
          return;
        }

        el("calls").innerHTML = `
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
              <tr>
                <th class="text-left font-medium px-3 py-2">When</th>
                <th class="text-left font-medium px-3 py-2">Outcome</th>
                <th class="text-left font-medium px-3 py-2">Version</th>
              </tr>
            </thead>
            <tbody>
              ${calls
                .map(
                  (c) => `
                <tr class="border-t border-slate-100">
                  <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${esc(time(c.started_at))}</td>
                  <td class="px-3 py-2">
                    <span class="px-2 py-0.5 rounded text-xs font-medium ${OUTCOME_STYLE[c.outcome] ?? "bg-slate-200 text-slate-700"}">${esc(c.outcome)}</span>
                    ${c.handoff_reason ? `<span class="ml-1.5 text-xs text-slate-500">${esc(c.handoff_reason)}</span>` : ""}
                  </td>
                  <td class="px-3 py-2 text-slate-500 text-xs">${esc(c.agent_version)}</td>
                </tr>`,
                )
                .join("")}
            </tbody>
          </table>`;
      }

      // --- Refresh ----------------------------------------------------------

      async function refresh() {
        // Independent panels: one failing endpoint should not blank the others.
        await Promise.allSettled([loadProposals(), loadDecisions(), loadEvalRuns(), loadCalls()]);
        el("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
      }

      el("refresh").addEventListener("click", refresh);
      refresh();
      setInterval(refresh, REFRESH_MS);
    </script>
  </body>
</html>
